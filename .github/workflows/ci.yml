name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.placeholder"
          AUTH_URL: "https://helvety.com"
          STORE_URL: "https://helvety.com"
          PDF_URL: "https://helvety.com"
          TASKS_URL: "https://helvety.com"
          CONTACTS_URL: "https://helvety.com"

      - name: Verify build manifests
        run: |
          echo "Verifying build manifests for all built apps..."
          missing=0
          for app_dir in apps/*/; do
            app_name=$(basename "$app_dir")
            # Check if build output exists
            if [ ! -d "${app_dir}.next" ]; then
              continue
            fi

            # Verify the Next.js build manifest exists
            manifest="${app_dir}.next/build-manifest.json"
            if [ -f "$manifest" ]; then
              echo "  ✓ ${app_name}: build manifest found"
            else
              echo "::error::${app_name}: missing build-manifest.json"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Manifest verification failed — one or more built apps are missing build-manifest.json"
            exit 1
          fi
          echo "Build manifest verification passed."
